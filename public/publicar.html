<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publicar tu propiedad · Wasipe</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#1B2733; --tinta-60:#51606D; --tinta-40:#8494A1;
  --niebla:#F4F6F8; --blanco:#FFFFFF; --linea:#E3E8ED;
  --fucsia:#E11D74; --fucsia-osc:#C01562; --fucsia-suave:#FDEBF3;
  --turquesa:#0FA3A0; --turquesa-suave:#E6F6F5;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --texto:'Instrument Sans',system-ui,sans-serif;
  --dato:'JetBrains Mono',ui-monospace,monospace;
  --radio:16px; --gutter:clamp(16px,4vw,40px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--niebla);color:var(--tinta);font-family:var(--texto);font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--fucsia);outline-offset:2px;border-radius:6px}
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.wrap{max-width:760px;margin:0 auto;padding-inline:var(--gutter)}
.nav{background:var(--blanco);border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:60}
.nav-in{display:flex;align-items:center;gap:16px;height:60px;max-width:760px;margin:0 auto;padding-inline:var(--gutter)}
.marca{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.04em}
.marca svg{width:19px;height:19px}
.guardado{margin-left:auto;font-size:13px;color:var(--tinta-40)}

.pasos{display:flex;gap:6px;padding-block:20px 0}
.paso-p{flex:1;height:5px;border-radius:99px;background:var(--linea);position:relative}
.paso-p.hecho{background:var(--turquesa)}
.paso-p.aqui{background:var(--fucsia)}
.paso-p.mal{background:var(--fucsia);box-shadow:0 0 0 2px var(--fucsia-suave)}
.paso-n{font-size:13px;color:var(--tinta-40);margin-top:8px}

.tarjeta{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);padding:clamp(18px,4vw,28px);margin-top:18px}
h1{font-size:clamp(22px,4vw,28px)}
.sub{color:var(--tinta-60);font-size:15px;margin-top:6px}

.opciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:18px}
.op{border:1.5px solid var(--linea);border-radius:12px;padding:14px;text-align:left;background:var(--niebla);font-weight:600;transition:.15s}
.op:hover{border-color:var(--tinta-40)}
.op[aria-pressed="true"]{border-color:var(--fucsia);background:var(--fucsia-suave);color:var(--fucsia-osc)}

.campo{display:block;margin-top:16px}
.campo>span{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.campo input,.campo select,.campo textarea{width:100%;border:1.5px solid var(--linea);border-radius:11px;padding:12px 14px;font:inherit;font-size:16px;background:var(--niebla)}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--fucsia);background:#fff}
.campo .pista{display:block;font-size:12.5px;color:var(--tinta-40);margin-top:5px;font-weight:400}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fila-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
[aria-invalid="true"]{border-color:var(--fucsia)!important;background:var(--fucsia-suave)!important}

.auto{position:relative}
.auto-lista{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--linea);border-radius:12px;box-shadow:0 10px 30px -12px rgba(27,39,51,.25);max-height:260px;overflow:auto;list-style:none}
.auto-lista li{padding:11px 14px;cursor:pointer;font-size:15px}
.auto-lista li:hover,.auto-lista li[aria-selected="true"]{background:var(--fucsia-suave);color:var(--fucsia-osc)}
.auto-lista small{color:var(--tinta-40);margin-left:6px}

.mercado{margin-top:10px;border-radius:11px;padding:12px 14px;font-size:14px;background:var(--niebla);border:1px solid var(--linea)}
.mercado b{font-family:var(--dato)}
.mercado.bajo{background:var(--turquesa-suave);border-color:#bfe6e4}
.mercado.alto{background:var(--fucsia-suave);border-color:#f6cfe0}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1.5px solid var(--linea);background:var(--niebla);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--turquesa);background:var(--turquesa-suave);color:#0a6b69}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:12px;font-weight:700;font-size:16px;transition:.15s}
.btn-primario{background:var(--fucsia);color:#fff}
.btn-primario:hover{background:var(--fucsia-osc)}
.btn-primario:disabled{opacity:.55;cursor:default}
.btn-blanco{background:var(--blanco);border:1.5px solid var(--linea)}
.pie{display:flex;gap:10px;justify-content:space-between;margin-top:22px;padding-bottom:50px}

.aviso{border-radius:11px;padding:12px 15px;font-size:14.5px;margin-top:14px}
.aviso-mal{background:var(--fucsia-suave);color:var(--fucsia-osc)}
.aviso-bien{background:var(--turquesa-suave);color:#0a6b69}
.faltan{list-style:none;margin-top:8px}
.faltan li{padding:4px 0;font-size:14px}
.faltan a{color:var(--fucsia);font-weight:700;text-decoration:underline}

/* subidor */
.sf-soltar{display:grid;place-items:center;gap:5px;text-align:center;border:2px dashed var(--linea);border-radius:14px;padding:28px 18px;cursor:pointer;color:var(--tinta-60);background:var(--niebla)}
.sf-soltar:hover,.sf-soltar.encima{border-color:var(--fucsia);color:var(--fucsia);background:var(--fucsia-suave)}
.sf-soltar b{font-size:16.5px;color:var(--tinta)}
.sf-soltar span{font-size:13.5px}
.sf-aviso{font-size:13.5px;color:var(--tinta-60);margin-top:10px;min-height:20px}
.sf-aviso.bien{color:var(--turquesa)}
.sf-aviso.mal{color:var(--fucsia)}
.sf-lista{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.sf-item{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--linea);background:var(--niebla)}
.sf-item img{aspect-ratio:4/3;object-fit:cover;width:100%}
.sf-item.error{border-color:var(--fucsia)}
.sf-portada{position:absolute;top:6px;left:6px;background:var(--turquesa);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px}
.sf-barra{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.15)}
.sf-barra i{display:block;height:100%;background:var(--fucsia);transition:width .2s}
.sf-error,.sf-nota{position:absolute;inset:auto 0 0 0;background:rgba(27,39,51,.85);color:#fff;font-size:11px;padding:4px 6px}
.sf-acciones{display:flex;gap:2px;padding:5px;background:#fff;border-top:1px solid var(--linea)}
.sf-acciones button{flex:1;font-size:12px;padding:5px 2px;border-radius:6px;color:var(--tinta-60)}
.sf-acciones button:hover:not(:disabled){background:var(--niebla);color:var(--tinta)}
.sf-acciones button:disabled{opacity:.3;cursor:default}
@media(max-width:560px){.fila,.fila-3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<nav class="nav"><div class="nav-in">
  <a href="/" class="marca" translate="no">
    <svg viewBox="0 0 24 24" fill="none"><path d="M2 11.5 12 3l10 8.5" stroke="#E11D74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 12v8h14v-8" stroke="#1B2733" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Wasipe
  </a>
  <span class="guardado" id="guardado"></span>
</div></nav>

<main class="wrap" id="app">
  <p style="padding:40px 0;color:var(--tinta-60)">Cargando…</p>
</main>

<script type="module">
import { api, dinero, numero } from '/cuenta.js';
import { crearSubidor } from '/componentes/subidor-fotos.js';

const app = document.getElementById('app');
const elGuardado = document.getElementById('guardado');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let aviso = null;      // el borrador
let ubicacion = null;  // { id, distrito, slug }
let subidor = null;
let paso = 1;
let referencia = null; // índice del distrito
const TOTAL = 5;

/* ------------------------- arranque ------------------------- */

/**
 * El arranque va en una función que se llama AL FINAL del módulo.
 *
 * Si se ejecuta aquí arriba, `pintar()` corre antes de que se evalúen las
 * const de más abajo (NOMBRES, CARACTERISTICAS) y revienta con
 * "Cannot access 'NOMBRES' before initialization": las const se izan pero
 * quedan en zona muerta temporal hasta su declaración.
 */
const idEnUrl = location.pathname.replace(/^\/publicar\/?/, '').replace(/\/$/, '');

async function arrancar() {
  try {
    await api('/cuentas/yo');
  } catch {
    location.href = '/ingresar?volver=' + encodeURIComponent(location.pathname);
    return;
  }

  if (!idEnUrl) return pintar();

  try {
    const r = await api(`/propiedades/${idEnUrl}`);
    aviso = r.propiedad;
    ubicacion = aviso.ubicacion ?? null;
    paso = 2;
    pintar();
  } catch {
    location.href = '/publicar';
  }
}

/* ------------------------- guardado ------------------------- */

let temporizador;
function guardar(campos, inmediato = false) {
  if (!aviso) return;
  clearTimeout(temporizador);
  const hacer = async () => {
    elGuardado.textContent = 'Guardando…';
    try {
      const r = await api(`/propiedades/${aviso.id}`, { method: 'PATCH', body: campos });
      aviso = r.propiedad;
      elGuardado.textContent = 'Guardado';
      setTimeout(() => { if (elGuardado.textContent === 'Guardado') elGuardado.textContent = ''; }, 2500);
    } catch (e) {
      elGuardado.textContent = '';
      mostrarError(e);
    }
  };
  inmediato ? hacer() : (temporizador = setTimeout(hacer, 800));
}

function mostrarError(e) {
  const caja = document.getElementById('alerta');
  if (!caja) return;
  caja.innerHTML = `<div class="aviso aviso-mal">${esc(e.message)}
    ${e.datos?.plan_sugerido ? ` <a href="/planes" style="text-decoration:underline">Ver planes</a>` : ''}</div>`;
  if (e.datos?.campo) {
    const el = document.querySelector(`[name="${e.datos.campo}"]`);
    if (el) { el.setAttribute('aria-invalid', 'true'); el.focus(); }
  }
}

/* --------------------------- pasos -------------------------- */

const NOMBRES = ['Qué y dónde', 'Fotos', 'Detalles', 'Precio', 'Tu aviso'];

function barra(malos = []) {
  return `<div class="pasos">${Array.from({ length: TOTAL }, (_, i) => {
    const n = i + 1;
    const cls = malos.includes(n) ? 'mal' : n === paso ? 'aqui' : n < paso ? 'hecho' : '';
    return `<div class="paso-p ${cls}"></div>`;
  }).join('')}</div>
  <p class="paso-n">Paso ${paso} de ${TOTAL} · ${NOMBRES[paso - 1]}</p>`;
}

function pintar(malos = []) {
  app.innerHTML = barra(malos) + `<div id="contenido"></div>`;
  const c = document.getElementById('contenido');
  ({ 1: paso1, 2: paso2, 3: paso3, 4: paso4, 5: paso5 }[paso])(c);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

const pie = (atras, adelante, adelanteTexto = 'Continuar') => `
  <div class="pie">
    ${atras ? '<button class="btn btn-blanco" id="atras" type="button">Atrás</button>' : '<span></span>'}
    <button class="btn btn-primario" id="adelante" type="button">${adelanteTexto}</button>
  </div>`;

function conectarPie() {
  document.getElementById('atras')?.addEventListener('click', () => { paso--; pintar(); });
}

/* ---------------------- 1 · qué y dónde --------------------- */

function paso1(c) {
  c.innerHTML = `
    <div class="tarjeta">
      <h1>¿Qué vas a publicar?</h1>
      <p class="sub">Empecemos por lo básico. Toma menos de un minuto.</p>

      <div style="margin-top:20px"><b style="font-size:14px">Operación</b>
        <div class="opciones" id="op-operacion">
          <button class="op" data-v="venta" aria-pressed="true" type="button">Venta</button>
          <button class="op" data-v="alquiler" aria-pressed="false" type="button">Alquiler</button>
        </div>
      </div>

      <div style="margin-top:20px"><b style="font-size:14px">Tipo de inmueble</b>
        <div class="opciones" id="op-tipo">
          ${['departamento', 'casa', 'terreno', 'oficina', 'local', 'cochera']
            .map((t, i) => `<button class="op" data-v="${t}" aria-pressed="${i === 0}" type="button">
              ${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}
        </div>
      </div>

      <label class="campo auto" style="margin-top:22px"><span>¿En qué distrito está?</span>
        <input id="q-ubi" autocomplete="off" placeholder="Escribe el distrito, por ejemplo Miraflores"
               value="${esc(ubicacion?.distrito ?? '')}">
        <span class="pista">Puedes escribir sin tildes o con abreviatura (SJL, Surco…).</span>
      </label>
      <div id="alerta"></div>
    </div>
    ${pie(false, true, 'Continuar')}`;

  grupo('op-operacion');
  grupo('op-tipo');
  autocompletar();

  document.getElementById('adelante').addEventListener('click', async () => {
    const boton = document.getElementById('adelante');
    if (!ubicacion) {
      document.getElementById('alerta').innerHTML =
        '<div class="aviso aviso-mal">Elige el distrito de la lista.</div>';
      return;
    }
    boton.disabled = true; boton.textContent = 'Creando…';
    try {
      const cuerpo = {
        operacion: sel('op-operacion'),
        tipo: sel('op-tipo'),
        ubicacion_id: ubicacion.id,
      };
      if (aviso) {
        const r = await api(`/propiedades/${aviso.id}`, { method: 'PATCH', body: cuerpo });
        aviso = r.propiedad;
      } else {
        const r = await api('/propiedades', { method: 'POST', body: cuerpo });
        aviso = r.propiedad;
        history.replaceState(null, '', `/publicar/${aviso.id}`);
      }
      paso = 2; pintar();
    } catch (e) {
      boton.disabled = false; boton.textContent = 'Continuar';
      mostrarError(e);
    }
  });
}

const sel = (id) =>
  document.querySelector(`#${id} .op[aria-pressed="true"]`)?.dataset.v;

function grupo(id) {
  document.getElementById(id).addEventListener('click', (e) => {
    const b = e.target.closest('.op');
    if (!b) return;
    document.querySelectorAll(`#${id} .op`).forEach((x) =>
      x.setAttribute('aria-pressed', String(x === b)));
  });
}

function autocompletar() {
  const input = document.getElementById('q-ubi');
  let lista, t;
  const cerrar = () => { lista?.remove(); lista = null; };

  input.addEventListener('input', () => {
    ubicacion = null;
    clearTimeout(t);
    const q = input.value.trim();
    if (q.length < 2) return cerrar();
    t = setTimeout(async () => {
      try {
        const { sugerencias } = await api(`/ubicaciones/sugerir?q=${encodeURIComponent(q)}`);
        cerrar();
        if (!sugerencias.length) return;
        lista = document.createElement('ul');
        lista.className = 'auto-lista';
        lista.innerHTML = sugerencias.map((s) =>
          `<li data-id="${s.id}" data-d="${esc(s.distrito)}">${esc(s.distrito)}
            <small>${esc(s.provincia)}</small></li>`).join('');
        input.parentElement.appendChild(lista);
        lista.addEventListener('click', (e) => {
          const li = e.target.closest('li');
          if (!li) return;
          ubicacion = { id: li.dataset.id, distrito: li.dataset.d };
          input.value = li.dataset.d;
          cerrar();
        });
      } catch { cerrar(); }
    }, 220);
  });
  input.addEventListener('blur', () => setTimeout(cerrar, 180));
}

/* ------------------------- 2 · fotos ------------------------ */

function paso2(c) {
  c.innerHTML = `
    <div class="tarjeta">
      <h1>Sube tus fotos</h1>
      <p class="sub">Las ponemos primero a propósito: ya las tienes en el celular,
         y suben solas mientras llenas el resto.</p>
      <div id="subidor" style="margin-top:18px"></div>
      <div id="alerta"></div>
    </div>
    ${pie(true, true, 'Continuar')}`;

  subidor = crearSubidor({
    contenedor: document.getElementById('subidor'),
    propiedadId: aviso.id,
  });
  api(`/propiedades/${aviso.id}`).then(({ propiedad }) => {
    if (propiedad.medios?.length) subidor.cargar(propiedad.medios);
  }).catch(() => {});

  conectarPie();
  document.getElementById('adelante').addEventListener('click', () => { paso = 3; pintar(); });
}

/* ----------------------- 3 · detalles ----------------------- */

function paso3(c) {
  const v = (k) => (aviso?.[k] ?? '') === null ? '' : (aviso?.[k] ?? '');
  const esTerreno = aviso.tipo === 'terreno' || aviso.tipo === 'cochera';

  c.innerHTML = `
    <div class="tarjeta">
      <h1>Los datos del inmueble</h1>
      <p class="sub">Mientras más completo, más contactos recibes.</p>

      <div class="fila">
        <label class="campo"><span>Área total (m²)</span>
          <input name="area_m2" type="number" inputmode="decimal" min="1" value="${v('area_m2')}"></label>
        <label class="campo"><span>Área techada (m²)</span>
          <input name="area_techada_m2" type="number" inputmode="decimal" min="1" value="${v('area_techada_m2')}">
        </label>
      </div>

      ${esTerreno ? '' : `
      <div class="fila-3">
        <label class="campo"><span>Dormitorios</span>
          <input name="dormitorios" type="number" inputmode="numeric" min="0" max="30" value="${v('dormitorios')}"></label>
        <label class="campo"><span>Baños</span>
          <input name="banos" type="number" inputmode="numeric" min="0" max="30" value="${v('banos')}"></label>
        <label class="campo"><span>Cocheras</span>
          <input name="cocheras" type="number" inputmode="numeric" min="0" max="30" value="${v('cocheras')}"></label>
      </div>
      <div class="fila">
        <label class="campo"><span>Piso</span>
          <input name="piso" type="number" inputmode="numeric" value="${v('piso')}"></label>
        <label class="campo"><span>Antigüedad (años)</span>
          <input name="antiguedad" type="number" inputmode="numeric" min="0" max="200" value="${v('antiguedad')}"></label>
      </div>
      <label class="campo"><span>Estado</span>
        <select name="estado_inmueble">
          <option value="">Elegir…</option>
          ${[['estreno', 'De estreno'], ['buen-estado', 'En buen estado'],
             ['a-refaccionar', 'Para refaccionar'], ['en-construccion', 'En construcción'],
             ['en-planos', 'En planos']]
            .map(([k, t]) => `<option value="${k}" ${aviso.estado_inmueble === k ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
      </label>`}

      <label class="campo"><span>Referencia <em style="font-weight:400;color:var(--tinta-40)">(opcional)</em></span>
        <input name="referencia" maxlength="200" value="${esc(v('referencia'))}"
               placeholder="A media cuadra del parque Kennedy">
        <span class="pista">La dirección exacta nunca se muestra en público.</span>
      </label>
      <div id="alerta"></div>
    </div>
    ${pie(true, true)}`;

  autoGuardarCampos(c);
  conectarPie();
  document.getElementById('adelante').addEventListener('click', () => { paso = 4; pintar(); });
}

function autoGuardarCampos(c) {
  c.querySelectorAll('input[name], select[name], textarea[name]').forEach((el) => {
    const ev = el.tagName === 'SELECT' ? 'change' : 'input';
    el.addEventListener(ev, () => {
      el.removeAttribute('aria-invalid');
      const bruto = el.value.trim();
      let valor = bruto === '' ? null : (el.type === 'number' ? Number(bruto) : bruto);
      if (el.type === 'number' && Number.isNaN(valor)) return;
      guardar({ [el.name]: valor });
    });
  });
}

/* ------------------------- 4 · precio ----------------------- */

function paso4(c) {
  c.innerHTML = `
    <div class="tarjeta">
      <h1>¿Cuánto pides?</h1>
      <p class="sub">En Wasipe el precio siempre se ve. Es lo que nos hace distintos.</p>

      <div class="fila">
        <label class="campo"><span>Precio</span>
          <input name="precio" type="number" inputmode="decimal" min="1"
                 value="${aviso.precio ?? ''}" placeholder="185000"></label>
        <label class="campo"><span>Moneda</span>
          <select name="moneda">
            <option value="USD" ${aviso.moneda === 'USD' ? 'selected' : ''}>US$ Dólares</option>
            <option value="PEN" ${aviso.moneda === 'PEN' ? 'selected' : ''}>S/ Soles</option>
          </select></label>
      </div>
      <div id="mercado"></div>

      <label class="campo"><span>Mantenimiento mensual (S/) <em style="font-weight:400;color:var(--tinta-40)">(opcional)</em></span>
        <input name="mantenimiento" type="number" inputmode="decimal" min="0" value="${aviso.mantenimiento ?? ''}">
      </label>
      <div id="alerta"></div>
    </div>
    ${pie(true, true)}`;

  autoGuardarCampos(c);
  conectarPie();

  const calcular = () => pintarMercado();
  c.querySelector('[name=precio]').addEventListener('input', calcular);
  c.querySelector('[name=moneda]').addEventListener('change', calcular);

  cargarReferencia().then(calcular);
  document.getElementById('adelante').addEventListener('click', () => { paso = 5; pintar(); });
}

async function cargarReferencia() {
  if (referencia !== null || !ubicacion?.slug && !aviso?.ubicacion?.slug) return;
  const slug = aviso?.ubicacion?.slug ?? ubicacion?.slug;
  if (!slug) return;
  try { referencia = await api(`/indice/referencia/${slug}`); }
  catch { referencia = false; }
}

/**
 * El índice en vivo mientras escribe el precio. Es el momento donde el
 * diferenciador se paga solo: evita precios irreales y le enseña al que
 * publica para qué sirve el Índice, justo cuando le importa.
 */
function pintarMercado() {
  const caja = document.getElementById('mercado');
  if (!caja) return;
  const precio = Number(document.querySelector('[name=precio]')?.value);
  const moneda = document.querySelector('[name=moneda]')?.value ?? 'USD';
  const area = Number(aviso.area_m2);

  if (!precio || !area) { caja.innerHTML = ''; return; }

  const usd = moneda === 'USD' ? precio : precio / 3.8;
  const m2 = Math.round(usd / area);

  if (!referencia) {
    caja.innerHTML = `<div class="mercado">Tu precio es <b>US$ ${numero(m2)}/m²</b>.</div>`;
    return;
  }

  const dif = Math.round(((m2 - referencia.precio_m2_usd) / referencia.precio_m2_usd) * 100);
  const tono = dif < -8 ? 'bajo' : dif > 8 ? 'alto' : '';
  const frase = dif < -3
    ? `<b>${Math.abs(dif)}% debajo</b> del promedio de ${esc(referencia.distrito)}`
    : dif > 3
      ? `<b>${dif}% encima</b> del promedio de ${esc(referencia.distrito)}`
      : `en línea con el promedio de ${esc(referencia.distrito)}`;

  caja.innerHTML = `<div class="mercado ${tono}">
    Tu precio es <b>US$ ${numero(m2)}/m²</b> — ${frase}
    (US$ ${numero(referencia.precio_m2_usd)}/m²).
    ${dif > 25 ? '<br>Los avisos muy por encima del mercado reciben pocos contactos.' : ''}
  </div>`;
}

/* ------------------------- 5 · aviso ------------------------ */

const CARACTERISTICAS = [
  ['ascensor', 'Ascensor'], ['cochera', 'Cochera'], ['piscina', 'Piscina'],
  ['gimnasio', 'Gimnasio'], ['acepta-mascotas', 'Acepta mascotas'],
  ['amoblado', 'Amoblado'], ['seguridad-24h', 'Seguridad 24h'],
  ['areas-comunes', 'Áreas comunes'], ['balcon', 'Balcón'], ['deposito', 'Depósito'],
];

function paso5(c) {
  const puestas = new Set(aviso.caracteristicas ?? []);
  c.innerHTML = `
    <div class="tarjeta">
      <h1>Cómo se verá tu aviso</h1>
      <p class="sub">Un buen título y una descripción clara hacen la diferencia.</p>

      <label class="campo"><span>Título</span>
        <input name="titulo" maxlength="140" value="${esc(aviso.titulo ?? '')}"
               placeholder="Departamento de 3 dormitorios con vista al parque">
        <span class="pista">Entre 10 y 140 caracteres. Sin teléfonos.</span>
      </label>

      <label class="campo"><span>Descripción</span>
        <textarea name="descripcion" rows="6" maxlength="5000"
          placeholder="Cuenta cómo es, qué tiene cerca y por qué te gustó vivir ahí.">${esc(aviso.descripcion ?? '')}</textarea>
      </label>

      <div style="margin-top:18px"><b style="font-size:14px">Características</b>
        <div class="chips" id="caract">
          ${CARACTERISTICAS.map(([k, t]) =>
            `<button class="chip" type="button" data-v="${k}"
               aria-pressed="${puestas.has(k)}">${t}</button>`).join('')}
        </div>
      </div>
      <div id="alerta"></div>
    </div>
    ${pie(true, true, 'Publicar aviso')}`;

  autoGuardarCampos(c);
  conectarPie();

  document.getElementById('caract').addEventListener('click', (e) => {
    const b = e.target.closest('.chip');
    if (!b) return;
    b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
    guardar({
      caracteristicas: [...document.querySelectorAll('#caract .chip[aria-pressed="true"]')]
        .map((x) => x.dataset.v),
    }, true);
  });

  document.getElementById('adelante').addEventListener('click', publicar);
}

/* ------------------------- publicar ------------------------- */

async function publicar() {
  const boton = document.getElementById('adelante');
  boton.disabled = true; boton.textContent = 'Publicando…';
  clearTimeout(temporizador);

  try {
    const r = await api(`/propiedades/${aviso.id}/publicar`, { method: 'POST', body: {} });
    app.innerHTML = `
      <div class="tarjeta" style="text-align:center;padding:44px 24px;margin-top:30px">
        <div style="width:56px;height:56px;border-radius:50%;background:var(--turquesa-suave);
                    color:var(--turquesa);display:grid;place-items:center;margin:0 auto 16px;
                    font-size:28px">✓</div>
        <h1>${esc(r.mensaje)}</h1>
        <p class="sub" style="margin:8px auto 22px;max-width:38ch">
          Ya se puede encontrar en Wasipe. Los interesados te escribirán por aquí.</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <a class="btn btn-primario" href="/propiedad/${esc(aviso.slug)}">Ver mi aviso</a>
          <a class="btn btn-blanco" href="/panel">Ir a mi panel</a>
        </div>
      </div>`;
    window.scrollTo({ top: 0 });
  } catch (e) {
    boton.disabled = false; boton.textContent = 'Publicar aviso';

    // El backend devuelve TODOS los faltantes juntos: los marcamos sobre
    // los pasos para que se corrijan de una vez, no de a uno.
    if (e.datos?.faltantes?.length) {
      const f = e.datos.faltantes;
      pintar([...new Set(f.map((x) => x.paso))]);
      document.getElementById('alerta').innerHTML = `
        <div class="aviso aviso-mal"><b>${esc(e.message)}</b>
          <ul class="faltan">${f.map((x) =>
            `<li>· ${esc(x.mensaje)} <a href="#" data-paso="${x.paso}">Ir al paso ${x.paso}</a></li>`
          ).join('')}</ul></div>`;
      document.getElementById('alerta').addEventListener('click', (ev) => {
        const a = ev.target.closest('a[data-paso]');
        if (!a) return;
        ev.preventDefault();
        paso = Number(a.dataset.paso);
        pintar([...new Set(f.map((x) => x.paso))]);
      });
      return;
    }
    mostrarError(e);
  }
}
