# Configuración del proyecto de Supabase.
#
# `project_id` es solo el nombre de la carpeta de trabajo local: no es
# ningún secreto ni identifica al proyecto en la nube. El enlace con el
# proyecto real se hace con `supabase link`, que guarda la referencia
# fuera del repositorio.

project_id = "wasipe"

[api]
enabled = true
port = 54321
# Solo se expone el esquema public. `auth` y `storage` se manejan por sus
# propias APIs; publicarlos por PostgREST no aporta nada y amplía la
# superficie de ataque.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Registro abierto: publicar un aviso básico es gratis y no queremos
# fricción. La verificación de correo se activa cuando haya proveedor
# de envío configurado (ver RESEND_API_KEY en .env.example).
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

[storage]
enabled = true
# 10 MB por archivo: una foto de inmueble bien comprimida no llega ni a 2.
file_size_limit = "10MiB"
